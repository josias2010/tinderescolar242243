function render() {
  const app = document.getElementById('app');
  let html = '';
  
  switch(state.currentView) {
    case 'landing': html = renderLanding(); break;
    case 'auth': html = renderAuth(); break;
    case 'onboarding': html = renderOnboarding(); break;
    case 'app': html = renderApp(); break;
  }
  
  app.innerHTML = html;
  attachEvents();
}

function renderOnboarding() {
  const steps = [
    { title: 'Lo básico', subtitle: 'Cuéntanos sobre ti' },
    { title: 'Tus fotos', subtitle: 'Muestra tu mejor versión' },
    { title: 'Sobre ti', subtitle: 'Tu biografía y profesión' },

    { title: 'Relación', subtitle: '¿Qué buscas?' },
    { title: 'Personalidad', subtitle: 'Conócete mejor' },
    { title: '¡Listo!', subtitle: 'Tu perfil está preparado' }
  ];
  const step = steps[state.onboardingStep];
  const progress = ((state.onboardingStep + 1) / steps.length) * 100;

  return `
    <div class="min-h-screen bg-dark-900 flex flex-col">
      <div class="px-4 pt-6 pb-4">
        <div class="max-w-lg mx-auto">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-gray-500">Paso ${state.onboardingStep + 1} de ${steps.length}</span>
            <span class="text-xs text-nexora-400">${Math.round(progress)}%</span>
          </div>
          <div class="h-1.5 bg-white/10 rounded-full overflow-hidden">
            <div class="h-full gradient-primary rounded-full transition-all duration-500" style="width: ${progress}%"></div>
          </div>
        </div>
      </div>
      <div class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-lg fade-in">
          <h2 class="text-2xl font-bold mb-1">${step.title}</h2>
          <p class="text-gray-400 text-sm mb-6">${step.subtitle}</p>
          ${renderOnboardingStep()}
        </div>
      </div>
      <div class="px-4 pb-8">
        <div class="max-w-lg mx-auto flex gap-3">
          ${state.onboardingStep > 0 ? `<button onclick="prevStep()" class="px-6 py-3 rounded-xl glass-light hover:bg-white/10 transition font-medium text-sm">←</button>` : ''}
          <button onclick="nextStep()" class="flex-1 py-3 rounded-xl gradient-primary hover:opacity-90 transition font-semibold text-sm flex items-center justify-center gap-2">
            ${state.onboardingStep === steps.length - 1 ? 'Comenzar a explorar' : 'Siguiente'} ${icons.arrow}
          </button>
        </div>
      </div>
    </div>
  `;
}

// ============================================
// EVENT HANDLERS
// ============================================
function attachEvents() {}

function goToLanding() { state.currentView = 'landing'; render(); }
function goToAuth(mode) { state.authMode = mode; state.currentView = 'auth'; render(); }
function toggleAuthMode() { state.authMode = state.authMode === 'login' ? 'register' : 'login'; render(); }
function toggleMobileMenu() { state.showMobileMenu = !state.showMobileMenu; }
function toggleFaq(i) { state.openFaq = state.openFaq === i ? null : i; render(); }
function toggleFilters() { state.showFilters = !state.showFilters; render(); }
function toggleNotifications() { state.showNotifications = !state.showNotifications; }

function handleAuth(e) {
  e.preventDefault();
  state.isAuthenticated = true;
  if (state.authMode === 'register') {
    state.currentView = 'onboarding';
    state.onboardingStep = 0;
  } else {
    state.onboardingComplete = true;
    state.currentView = 'app';
  }
  render();
}

function nextStep() {
  if (state.onboardingStep < 7) {
    state.onboardingStep++;
    render();
  } else {
    state.onboardingComplete = true;
    state.currentView = 'app';
    render();
  }
}

function prevStep() {
  if (state.onboardingStep > 0) {
    state.onboardingStep--;
    render();
  }
}

function navigateApp(view) {
  state.currentAppView = view;
  state.selectedChat = null;
  render();
}

function swipe(dir) {
  state.swipeDirection = dir;
  if (dir === 'right') state.likesUsed++;
  if (dir === 'up') state.superLikesUsed++;
  render();
  setTimeout(() => {
    state.swipeDirection = null;
    state.currentProfileIndex++;
    if (dir === 'right' && Math.random() > 0.7) {
      state.matchProfile = profiles[state.currentProfileIndex % profiles.length];
      state.showMatch = true;
    }
    render();
  }, 400);
}

function showProfileDetail() { state.showProfileDetail = true; }
function openChat(userId) { state.selectedChat = userId; render(); }

function sendChatMessage() {
  if (!state.chatMessage.trim()) return;
  const conv = conversations.find(c => c.userId === state.selectedChat);
  if (conv) {
    conv.messages.push({
      id: `m_${Date.now()}`, senderId: 'me', text: state.chatMessage,
      timestamp: new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }),
      read: false
    });
    conv.lastMessage = state.chatMessage;
    conv.lastMessageTime = 'Ahora';
  }
  state.chatMessage = '';
  render();
  setTimeout(() => {
    const input = document.getElementById('chatInput');
    if (input) input.focus();
  }, 100);
}

function logout() {
  state.isAuthenticated = false;
  state.onboardingComplete = false;
  state.currentView = 'landing';
  state.currentAppView = 'discover';
  render();
}

// ============================================
// INIT
// ============================================
render();
</script>
